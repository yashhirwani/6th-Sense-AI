[project]
name = "sixthsense-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]", "uvicorn[standard]", "sqlalchemy>=2", "pydantic-settings", "pyjwt", "google-genai>=2.25",
  "httpx", "pillow", "numpy", "opencv-python-headless", "ultralytics", "rapidocr-onnxruntime", "onnxruntime",
  "pupil-apriltags", "rapidfuzz", "sentence-transformers", "torch", "torchvision",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
